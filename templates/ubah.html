<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Reservasi</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4CAF50;
            color:white;
            border:none;
            cursor:pointer;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Ubah Data Reservasi</h2>

    <form method="POST">

        <label>Nama</label>
        <input
            type="text"
            name="nama"
            value="{{ data.nama }}"
            required
        >

        <label>Jumlah Orang</label>
        <input
            type="number"
            name="jumlah"
            value="{{ data.jumlah }}"
            required
        >

        <label>Jam Mulai</label>
        <input
            type="time"
            name="jam_mulai"
            value="{{ data.jam_mulai }}"
            required
        >

        <label>Jam Selesai</label>
        <input
            type="time"
            name="jam_selesai"
            value="{{ data.jam_selesai }}"
            required
        >

        <button type="submit">
            Simpan Perubahan
        </button>

    </form>

</div>

</body>
</html>
