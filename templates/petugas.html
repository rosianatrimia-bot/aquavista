<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Petugas</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#eef7fb;
            padding:40px;
        }

        .container{
            max-width:1000px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#003049;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:14px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#7ad7ff;
            color:#003049;
        }

        .btn{
            padding:8px 12px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            color:white;
            text-decoration:none;
            font-size:14px;
        }

        .edit{
            background:#2d9cdb;
        }

        .hapus{
            background:#e63946;
        }

        .kembali{
            display:block;
            margin-top:30px;
            text-align:center;
            background:#003049;
            padding:12px;
            border-radius:10px;
            color:white;
            text-decoration:none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Data Reservasi Pengunjung</h1>

        <table>
            <tr>
                <th>Nama</th>
                <th>Jumlah Orang</th>
                <th>Jam Mulai</th>
                <th>Jam Selesai</th>
                <th>Aksi</th>
            </tr>

            {% for pengunjung in data_pengunjung %}
            <tr>
                <td>{{ pengunjung.nama }}</td>
                <td>{{ pengunjung.jumlah }}</td>
                <td>{{ pengunjung.jam_mulai }}</td>
                <td>{{ pengunjung.jam_selesai }}</td>
                <td>
                    <a class="btn edit" href="/ubah/{{ pengunjung.id }}">Edit</a>
                    <a class="btn hapus" href="/hapus/{{ pengunjung.id }}"
                       onclick="return confirm('Yakin ingin menghapus data ini?')">
                       Hapus
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>

        <a class="kembali" href="/">Kembali ke Halaman Utama</a>

    </div>

</body>
</html>
